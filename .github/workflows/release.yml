name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Strip leading 'v' from tag
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Run tests
        run: swift test

      - name: Build app and create DMG
        run: ./scripts/bundle-app.sh --version "${{ steps.version.outputs.version }}" --dmg

      - name: Verify app bundle
        run: |
          echo "==> Bundle contents:"
          find build/KTApple.app -type f
          echo ""
          echo "==> Info.plist:"
          plutil -p build/KTApple.app/Contents/Info.plist
          echo ""
          echo "==> Executable type:"
          file build/KTApple.app/Contents/MacOS/KTApple

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}
          name: KTApple ${{ steps.version.outputs.version }}
          files: build/KTApple-${{ steps.version.outputs.version }}-arm64.dmg

      - name: Open a Homebrew tap pull request
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          TAP="m96-chan/homebrew-tap"
          VERSION="${{ steps.version.outputs.version }}"
          DMG_PATH="build/KTApple-${VERSION}-arm64.dmg"
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          BRANCH="ktapple-${VERSION}"

          echo "==> Preparing tap update (version=${VERSION}, sha256=${SHA256})"

          CASK_CONTENT="cask \"ktapple\" do
            version \"${VERSION}\"
            sha256 \"${SHA256}\"

            url \"https://github.com/m96-chan/KTApple/releases/download/v#{version}/KTApple-#{version}-arm64.dmg\"
            name \"KTApple\"
            desc \"KDE Plasma KWin-style tiling window manager for macOS\"
            homepage \"https://github.com/m96-chan/KTApple\"

            depends_on macos: \">= :ventura\"

            app \"KTApple.app\"

            zap trash: [
              \"~/Library/Application Support/KTApple\",
            ]
          end
          "

          # The tap requires changes to arrive by pull request so that
          # verify-casks can check the URL and hash before anything is
          # published to users. Push to a branch, then open the PR.
          MAIN_SHA=$(gh api "repos/${TAP}/git/ref/heads/main" --jq '.object.sha')
          if gh api "repos/${TAP}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "==> Branch ${BRANCH} exists, moving it to main"
            gh api -X PATCH "repos/${TAP}/git/refs/heads/${BRANCH}" \
              -f sha="$MAIN_SHA" -F force=true --jq '.ref'
          else
            gh api -X POST "repos/${TAP}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="$MAIN_SHA" --jq '.ref'
          fi

          FILE_SHA=$(gh api "repos/${TAP}/contents/Casks/ktapple.rb?ref=${BRANCH}" --jq '.sha')
          ENCODED=$(printf '%s' "$CASK_CONTENT" | base64)

          gh api -X PUT "repos/${TAP}/contents/Casks/ktapple.rb" \
            --field message="Update KTApple to ${VERSION}" \
            --field content="$ENCODED" \
            --field sha="$FILE_SHA" \
            --field branch="$BRANCH" \
            --jq '.content.path'

          PR_URL=$(gh api "repos/${TAP}/pulls" \
            -f title="Update KTApple to ${VERSION}" \
            -f head="$BRANCH" \
            -f base=main \
            -f body="Automated from the KTApple release workflow.

          - version: \`${VERSION}\`
          - sha256: \`${SHA256}\`

          verify-casks confirms the URL and hash against the published asset before this merges." \
            --jq '.html_url' 2>/dev/null \
            || gh pr list -R "$TAP" --head "$BRANCH" --json url --jq '.[0].url')

          echo "==> Pull request: ${PR_URL}"

          # Merges itself once verify-casks passes; stays open if it fails.
          gh pr merge "$PR_URL" --squash --auto

          echo "==> Tap PR opened and queued for auto-merge"
